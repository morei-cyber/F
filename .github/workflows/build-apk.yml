
name: Build FOCUS ROOM Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ZIPから本来のAndroidプロジェクト構成を復元
      - name: Restore project folders from ZIP
        run: |
          test -f FOCUS_ROOM_GITHUB_ROOT.zip
          unzip -o FOCUS_ROOM_GITHUB_ROOT.zip -d . -x '.github/workflows/build-apk.yml'

          echo "Checking project structure..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Project structure OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 古いtoolsパッケージを要求しないバージョン
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FOCUS-ROOM-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
